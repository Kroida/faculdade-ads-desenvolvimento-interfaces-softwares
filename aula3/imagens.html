<!DOCTYPE html>
<html>
	<head> 
		<title> Aula 02 - Imagens </title>
	</head>
	<body>
		<!-- Atributo href define links, enquanto src carrega imagens -->
		<!-- Para imagens locais, use "nome-da-pasta/nome-da-imagem" -->
		<!-- Definir apenas width ou height faz o navegador ajustar a proporção automaticamente -->
		
		<h1> Dark Souls Cachaceiro </h1>
		
		<!-- Inserção de imagem externa -->
		<!-- <img> exibe imagens; o atributo src define a fonte -->
		<!-- width ajusta a largura e height ajusta a altura -->
		<img src="https://steamuserimages-a.akamaihd.net/ugc/780749243098419340/79EE1A195880FD16ECD83418A39697A451B04314/?imw=512&&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false" alt="dark churras" width="200px">
		
		<!-- Inserção de imagem local -->
		<!-- O atributo alt define um texto alternativo para acessibilidade -->
		<img src="img/birita.jfif" alt="cavaleiros bebuns 4K full HD 60 FPS" width="800px" height="150px">
	</body>
</html>
