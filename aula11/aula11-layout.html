<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags de Layout</title>
</head>

<body>
    <!-- Cabeçalho do site -->
    <header id="topo">
        <div class="logo">LOGOTIPO</div>
        <!-- Navegação principal -->
        <nav class="menu">MENU</nav>
    </header>

    <!-- Seção de banner -->
    <section class="banner">
        BANNER
    </section>

    <!-- Seção de serviços -->
    <section class="servicos">
        Lista de Serviços
    </section>

    <!-- Conteúdo principal -->
    <main>
        <h1>Conteúdo principal da página</h1>
        <!-- Artigos e notícias -->
        <article>
            Notícia / Artigo
        </article>
    </main>

    <!-- Barra lateral com conteúdos extras -->
    <aside>
        Conteúdo complementar (barra lateral)
    </aside>

    <!-- Seção de depoimentos -->
    <section class="depoimentos">
        Depoimentos de clientes
    </section>

    <!-- Rodapé do site -->
    <footer id="rodape">
        <p>Todos os direitos reservados</p>
    </footer>
</body>

</html>
