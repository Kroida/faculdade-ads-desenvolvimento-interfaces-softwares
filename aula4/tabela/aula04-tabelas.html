<!DOCTYPE html>
<html>
<head>
	<title> Criando Tabelas </title>
</head>
<body>
	<h1> Inserindo Tabelas com HTML </h1>
	<!-- <table> define uma tabela; os dados tabulares são inseridos entre sua abertura e fechamento. -->
	<table border="1">
		<!-- <thead> define o cabeçalho da tabela. -->
		<thead> 
			<!-- <tr> representa uma linha dentro da tabela. -->
			<tr>
				<!-- <th> representa células de cabeçalho dentro de <thead>; geralmente são destacadas. -->
				<th> Nome </th>
				<th> Curso </th>
				<th> Telefone </th>
				<th> Cidade </th>
			</tr>
		</thead>
		<!-- <tbody> contém os dados da tabela. -->
		<tbody>
			<!-- Cada linha da tabela deve conter um número consistente de colunas. -->
			<tr> 
				<td> Fulano </td>
				<!-- rowspan faz com que a célula ocupe múltiplas linhas. -->
				<td rowspan="2"> ADS </td>
				<td> 51 9999-9999 </td>
				<td> POA </td>
			</tr>
			<tr>
				<td> Carlos </td>
				<td> 51 8888-9999 </td>
				<td> Canoas </td>
			</tr>
			<tr>
				<td> Vitor </td>
				<td> PMM </td>
				<td> 51 7777-9999 </td>
				<td> POA </td>
			</tr>
		</tbody>
		<!-- <tfoot> define o rodapé da tabela com informações adicionais. -->
		<tfoot>
		<tr>
			<!-- colspan faz com que a célula ocupe múltiplas colunas. -->
			<td colspan="4"> Tabela de Cadastro de Alunos </td>
		</tr>
		</tfoot>
	</table>
</body>
</html>
